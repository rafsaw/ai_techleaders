services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: devmentor
      POSTGRES_PASSWORD: devmentor
      POSTGRES_DB: devmentor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmentor"]
      interval: 5s
      retries: 10

  # Local SMTP sink for development: the app sends to smtp://localhost:1025,
  # and the inbox is at http://localhost:8025. Keep the tag in sync with
  # packages/app/tests/integration/mailpit.ts.
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
