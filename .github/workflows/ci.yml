name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.3"
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.3"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    name: Unit tests (100% coverage)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.3"
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.3"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: production-build
          path: |
            packages/app/.next/
            !packages/app/.next/cache/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  integration:
    name: Integration tests (PostgreSQL + agent-browser)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.3"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: production-build
          path: packages/app/.next
      - run: npm run test:integration:install -- --with-deps
      - run: docker info
      - run: npm run test:integration
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-results
          path: test-results/integration/
          retention-days: 7

  storybook:
    name: Storybook tests (light + dark)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.3"
          cache: npm
      - run: npm ci
      - run: npm exec --workspace @devmentor/ui -- playwright install --with-deps chromium
      - run: npm run test:storybook

  tokens:
    name: Values outside tokens
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.3"
          cache: npm
      - run: npm ci
      - run: npm run check:tokens
